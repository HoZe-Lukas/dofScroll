#
# Dry run of the Linux packages: builds RPM, DEB and TGZ exactly as a tag build does (same
# reusable workflow) and uploads them as artifacts. Creates no release and needs no tag. Start it
# with `gh workflow run linux-packages-dry-run.yml --ref <branch>` or from the Actions tab.
# It also runs for pull requests that touch the packaging files.
name: linux-packages-dry-run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/linux-packages.yml"
      - ".github/workflows/linux-packages-dry-run.yml"
      - ".github/workflows/linux-smoke.yml"
      - "scripts/smoke-install.sh"
      - "scripts/bundle-qt-linux.sh"
      - "packaging/qt.env"
      - "packaging/ci/**"
      - "third-party/**"
      - "THIRD-PARTY-NOTICES.md"
      - "packaging/cpack/**"
      - "packaging/linux/**"
      - "systemd/**"
      - "cmake/Systemd.cmake"
      - "cmake/Ui.cmake"
      - "cmake/PackageLayoutTest.cmake"

permissions:
  contents: read

concurrency:
  group: linux-packages-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    uses: ./.github/workflows/linux-packages.yml

  # Install smoke test in fresh distribution containers. Only the build distributions can fail it.
  smoke:
    needs: packages
    uses: ./.github/workflows/linux-smoke.yml
