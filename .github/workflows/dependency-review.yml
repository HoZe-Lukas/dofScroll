name: dependency-review

# Advisory gate: it needs the dependency graph, which is only available for public repositories
# (or private ones with GitHub Advanced Security), so it is not part of the required checks.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: depreview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# actions/checkout = v4.2.2, actions/dependency-review-action = v5.0.0 (pinned by SHA)

jobs:
  dependency-review:
    name: dependency review
    # Needs a public repository (or Advanced Security): skip while private.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read        # checkout / read the PR's dependency diff
      pull-requests: read   # the action looks up the PR (comment-summary-in-pr is off)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the dependency graph is available
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" > /dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The dependency graph is off in the repository settings: dependency review skipped"
          fi
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        if: steps.graph.outputs.available == 'true'
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
