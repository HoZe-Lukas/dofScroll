name: dependency-review

# Advisory gate: it needs the dependency graph, which is only available for public repositories
# (or private ones with GitHub Advanced Security), so it is not part of the required checks.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: depreview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# actions/checkout = v4.2.2, actions/dependency-review-action = v5.0.0 (pinned by SHA)

jobs:
  dependency-review:
    name: dependency review
    # Needs a public repository (or Advanced Security): skip while private.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read        # checkout / read the PR's dependency diff
      pull-requests: read   # the action looks up the PR (comment-summary-in-pr is off)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
