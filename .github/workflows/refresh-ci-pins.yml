#
# Monthly refresh of the pinned build inputs (docs/releasing.md, "Pinned build inputs"): the image
# digests (scripts/pin-ci-images.sh) and the hash-pinned aqtinstall requirements
# (scripts/update-aqt-requirements.sh). Pins give stability, the newest versions are wanted: when
# anything changed, this job opens (or updates) the pull request "Refresh CI pins", so that CI
# proves the newest versions work. It never merges: a person reviews and merges the PR, before a
# release, so that the release uses the newest tested versions. The GitHub Actions SHAs are
# refreshed by Dependabot (.github/dependabot.yml).
#
# The pins are only needed at a release, so the job runs once a month and can be started by hand before a
# release (Actions > refresh-ci-pins > Run workflow). It changes only files under packaging/ci (the image
# digests live in packaging/ci/images.env, not in the workflow files), so the default GITHUB_TOKEN may push
# the branch: no extra secret is needed. A branch pushed and a pull request opened with that token do not
# start other workflows (GitHub does not chain them), but a dispatch does: the last step starts the checks
# of the PR (ci, lint, codeql, ports, ui and the Linux packages dry run) with `gh workflow run` on the branch;
# the runs belong to the commit and show up in the checks of the PR. (A fine-grained token stored as the
# secret REFRESH_PINS_TOKEN, contents and pull requests: write, would start them by itself; it is optional,
# and the dispatch is skipped then.) The repository setting "Allow GitHub Actions to create and approve pull
# requests" must be on.
name: refresh-ci-pins

on:
  schedule:
    - cron: "17 4 1 * *"   # monthly, the 1st at 04:17 UTC (after the 03:41 ci-image run)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-ci-pins
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh pinned images and aqtinstall hashes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # push the branch ci/refresh-pins; only this job
      pull-requests: write   # open or update the pull request; only this job
      actions: write         # start the checks of the PR with workflow_dispatch; only this job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Refresh image digests and aqtinstall hashes
        run: |
          sh scripts/pin-ci-images.sh
          # Python 3.10: the oldest Python of the builds decides which versions can be resolved
          docker run --rm -v "$PWD":/w -w /w python:3.10-slim sh scripts/update-aqt-requirements.sh
          sh scripts/check-ci-pins.sh
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PINS_TOKEN || github.token }}
          OWN_TOKEN: ${{ secrets.REFRESH_PINS_TOKEN != '' && 'yes' || '' }}
        run: |
          if git diff --quiet; then
            echo "Pins are current, nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --stat | tee -a "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci/refresh-pins
          git add -A packaging/ci
          git commit -m "Refresh CI pins: image digests and aqtinstall hashes"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/refresh-pins
          if [ -n "$(gh pr list --head ci/refresh-pins --state open --json number --jq '.[].number')" ]; then
            echo "Updated the open pull request." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --base main --head ci/refresh-pins --title "Refresh CI pins" \
              --body "Monthly refresh of the pinned image digests and the hash-pinned aqtinstall requirements (scripts/pin-ci-images.sh, scripts/update-aqt-requirements.sh). Review the diff, let CI prove the new versions work, then merge. Merge this before a release so the release uses the newest tested versions. Opened by .github/workflows/refresh-ci-pins.yml."
          fi
          # A push and a pull request made with the default token start no workflows; a dispatch does.
          if [ -z "$OWN_TOKEN" ]; then
            for w in ci.yml lint.yml codeql.yml ports.yml ui.yml linux-packages-dry-run.yml; do
              gh workflow run "$w" --ref ci/refresh-pins
            done
            echo "Started the checks of the pull request (workflow_dispatch on ci/refresh-pins)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
