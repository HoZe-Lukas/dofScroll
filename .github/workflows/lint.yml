name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (tag in the comment).
#   actions/checkout = v4.2.2
# Tool binaries are pinned by release version AND SHA-256 checksum:
#   actionlint 1.7.12 (checksum from the upstream actionlint_1.7.12_checksums.txt)
#   shellcheck 0.11.0 (upstream publishes no checksum file; the hash below was computed
#                      from the release tarball when pinning)

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned shellcheck
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          tarball="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${tarball}"
          echo "${SHELLCHECK_SHA256}  ${tarball}" | sha256sum -c -
          tar -xJf "$tarball"
          echo "$RUNNER_TEMP/tools/shellcheck-v${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"

      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/tools/actionlint" && cd "$RUNNER_TEMP/tools/actionlint"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          echo "$RUNNER_TEMP/tools/actionlint" >> "$GITHUB_PATH"

      - name: actionlint (workflows, shellcheck runs on the run blocks)
        run: actionlint -color

      - name: shellcheck (scripts)
        run: shellcheck --severity=warning --external-sources scripts/*.sh scripts/pre-commit

      - name: SPDX headers
        run: sh scripts/check-spdx.sh

      - name: UTF-8 text files
        run: sh scripts/check-utf8.sh
