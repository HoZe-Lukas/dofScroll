name: ci

on:
  # Push builds only for main and release tags; every other branch is built via its PR,
  # so WIP/scratch branch pushes do not send failure mails.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege: no job needs more than read access to the repository contents.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Third-party actions are pinned to full commit SHAs (tag in the comment).
#   actions/checkout        = v4.2.2
#   actions/upload-artifact = v4.6.2
#   actions/download-artifact = v4.3.0

jobs:
  build-test:
    name: build + ctest (Rocky Linux 9)
    runs-on: ubuntu-latest
    container: rockylinux:9
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: |
          dnf install -y epel-release
          dnf install -y gcc-c++ make cmake git gettext pkgconf-pkg-config spacenavd \
            libspnav-devel libX11-devel libXtst-devel gtk3-devel libappindicator-gtk3-devel
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Check dependencies
        run: cmake -DWITH_TRAY=ON -P cmake/CheckDeps.cmake
      - name: Configure (-Werror)
        run: cmake -S . -B build -DDOFSCROLL_WERROR=ON
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Hardening check
        run: sh scripts/check-hardening.sh build/dofscroll build/dofscroll-tray

  sanitizers:
    name: ASan/UBSan (Rocky Linux 9)
    runs-on: ubuntu-latest
    container: rockylinux:9
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: |
          dnf install -y epel-release
          dnf install -y gcc-c++ make cmake git libasan libubsan pkgconf-pkg-config spacenavd \
            libspnav-devel libX11-devel libXtst-devel
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Configure (ASan/UBSan, no tray)
        run: cmake -S . -B build-asan -DDOFSCROLL_SANITIZE=ON -DDOFSCROLL_TRAY=OFF
      - name: Build
        run: cmake --build build-asan -j4
      - name: Test
        run: ctest --test-dir build-asan --output-on-failure

  cppcheck:
    name: cppcheck (Rocky Linux 9)
    runs-on: ubuntu-latest
    container: rockylinux:9
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: |
          dnf install -y epel-release
          dnf install -y cppcheck git
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Static analysis
        run: |
          cppcheck --enable=warning,performance,portability --error-exitcode=1 \
            --inline-suppr --suppress='assertWithSideEffect:tests/*' -Isrc src tests

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      # Same patterns as the pre-commit hook (scripts/secret-scan.sh). The whole tree is
      # diffed against the empty tree, so every committed line is scanned, not only new ones.
      - name: Scan tree for secrets
        run: sh scripts/secret-scan.sh 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD

  package-rpm:
    name: package RPM + TGZ (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test, sanitizers, cppcheck, secret-scan]
    runs-on: ubuntu-latest
    container: rockylinux:9
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: |
          dnf install -y epel-release
          dnf install -y gcc-c++ make cmake git gettext pkgconf-pkg-config spacenavd rpm-build cpio \
            libspnav-devel libX11-devel libXtst-devel gtk3-devel libappindicator-gtk3-devel
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j4
      - name: Package
        run: cd build && cpack -G "RPM;TGZ"
      - name: Scan packages for build or staging paths
        run: |
          mkdir -p /tmp/scan/rpm /tmp/scan/tgz
          for f in build/dofscroll-*.rpm; do (cd /tmp/scan/rpm && rpm2cpio "$GITHUB_WORKSPACE/$f" | cpio -idm --quiet); done
          for f in build/dofscroll-*.tar.gz; do tar xzf "$f" -C /tmp/scan/tgz; done
          if grep -rIn -e _CPack_Packages -e /__w/ -e "$GITHUB_WORKSPACE" /tmp/scan; then
            echo "package contains a staging, build or source path" >&2; exit 1
          fi
          grep -rh '^ExecStart=' /tmp/scan | sort -u
          if grep -rh '^ExecStart=' /tmp/scan | grep -v '^ExecStart=/usr/bin/'; then
            echo "a packaged unit has an ExecStart outside /usr/bin" >&2; exit 1
          fi
          test -z "$(find /tmp/scan -path '*/usr/lib/udev/*' -type f)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: packages-rpm-tgz
          path: |
            build/dofscroll-*.rpm
            build/dofscroll-*.tar.gz
          if-no-files-found: error

  package-deb:
    name: package DEB (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test, sanitizers, cppcheck, secret-scan]
    runs-on: ubuntu-latest
    container: debian:12
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends g++ make cmake git ca-certificates gettext file \
            pkg-config dpkg-dev libspnav-dev libx11-dev libxtst-dev libgtk-3-dev \
            libayatana-appindicator3-dev
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j4
      - name: Package
        run: cd build && cpack -G DEB
      - name: Scan package for build or staging paths
        run: |
          mkdir -p /tmp/scan
          for f in build/dofscroll*.deb; do dpkg-deb -x "$f" /tmp/scan; done
          if grep -rIn -e _CPack_Packages -e /__w/ -e "$GITHUB_WORKSPACE" /tmp/scan; then
            echo "package contains a staging, build or source path" >&2; exit 1
          fi
          grep -rh '^ExecStart=' /tmp/scan | sort -u
          if grep -rh '^ExecStart=' /tmp/scan | grep -v '^ExecStart=/usr/bin/'; then
            echo "a packaged unit has an ExecStart outside /usr/bin" >&2; exit 1
          fi
          test -z "$(find /tmp/scan -path '*/usr/lib/udev/*' -type f)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: packages-deb
          path: build/dofscroll*.deb
          if-no-files-found: error

  # Unsigned Windows (installer + ZIP) and macOS (DMG) packages, built on the GitHub runners
  # (jobs package-windows and package-macos in installers.yml; also run by installers-dry-run.yml).
  installers:
    name: Windows and macOS installers (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test, sanitizers, cppcheck, secret-scan]
    uses: ./.github/workflows/installers.yml

  release:
    name: publish GitHub release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-rpm, package-deb, installers]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # create the release and upload assets; only this job gets write access
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false  # the write token must not stay in .git/config
      - name: Tag must match the CMake project version
        run: |
          ver="$(sed -n 's/^project(dofscroll VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)"
          tag="${GITHUB_REF_NAME#v}"
          [ -n "$ver" ] || { echo "no project version found in CMakeLists.txt" >&2; exit 1; }
          case "$tag" in
            "$ver"|"$ver"-*) ;;
            *) echo "Tag $GITHUB_REF_NAME does not match project version $ver in CMakeLists.txt" >&2; exit 1 ;;
          esac
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          # every downloaded file: RPM, DEB, TGZ, Windows setup + ZIP, macOS DMG
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\n' | LC_ALL=C sort \
            | xargs -d '\n' sha256sum -- > ../SHA256SUMS.tmp
          mv ../SHA256SUMS.tmp SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "dofscroll ${GITHUB_REF_NAME#v}" $flags
