name: ci

on:
  # Push builds only for main and release tags; every other branch is built via its PR,
  # so WIP/scratch branch pushes do not send failure mails.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege: no job needs more than read access to the repository contents.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Third-party actions are pinned to full commit SHAs (tag in the comment).
#   actions/checkout        = v4.2.2
#   actions/upload-artifact = v4.6.2
#   actions/download-artifact = v4.3.0
#   actions/attest-build-provenance = v4.2.2

jobs:
  # Reads the pinned container images (packaging/ci/images.env) for the jobs below (`container:`).
  pins:
    name: pinned images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rocky9_image: ${{ steps.read.outputs.ROCKY9_IMAGE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: packaging/ci
          persist-credentials: false
      - id: read
        run: grep -E '^[A-Z0-9_]+=' packaging/ci/images.env >> "$GITHUB_OUTPUT"

  build-test:
    name: build + ctest (Rocky Linux 9)
    runs-on: ubuntu-latest
    needs: pins
    container: ${{ needs.pins.outputs.rocky9_image }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check dependencies
        run: cmake -P cmake/CheckDeps.cmake
      - name: Configure (-Werror)
        run: cmake -S . -B build -DDOFSCROLL_WERROR=ON
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Hardening check
        run: sh scripts/check-hardening.sh build/dofscroll

  sanitizers:
    name: ASan/UBSan (Rocky Linux 9)
    runs-on: ubuntu-latest
    needs: pins
    container: ${{ needs.pins.outputs.rocky9_image }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Configure (ASan/UBSan)
        run: cmake -S . -B build-asan -DDOFSCROLL_SANITIZE=ON
      - name: Build
        run: cmake --build build-asan -j4
      - name: Test
        run: ctest --test-dir build-asan --output-on-failure
      - name: Fuzz the profile loader and the migration (ASan/UBSan)
        # tests/test_profile_fuzz.cpp: random and mutated config trees; the seed changes per run and is printed,
        # a failure replays with --seed S --only K (see the header of the file)
        run: build-asan/tests/test_profile_fuzz --iterations 300 --seed "${{ github.run_number }}"
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1

  cppcheck:
    name: cppcheck (Rocky Linux 9)
    runs-on: ubuntu-latest
    needs: pins
    container: ${{ needs.pins.outputs.rocky9_image }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Static analysis
        run: |
          cppcheck --enable=warning,performance,portability --error-exitcode=1 \
            --inline-suppr --suppress='assertWithSideEffect:tests/*' -Isrc src tests

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      # Same patterns as the pre-commit hook (scripts/secret-scan.sh). The whole tree is
      # diffed against the empty tree, so every committed line is scanned, not only new ones.
      - name: Scan tree for secrets
        run: sh scripts/secret-scan.sh 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD

  # RPM, DEB and TGZ (with the Qt interface where the distribution has Qt6), built in distribution
  # containers by linux-packages.yml; also run by linux-packages-dry-run.yml.
  linux-packages:
    name: Linux packages (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test, sanitizers, cppcheck, secret-scan]
    uses: ./.github/workflows/linux-packages.yml

  # Install smoke test of the packages in fresh containers (linux-smoke.yml). Informational: the
  # release job does NOT need it, so it never blocks publishing.
  linux-smoke:
    name: Linux install smoke test (tags only, informational)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-packages]
    uses: ./.github/workflows/linux-smoke.yml

  # Unsigned Windows (installer + ZIP) and macOS (DMG) packages, built on the GitHub runners
  # (jobs package-windows and package-macos in installers.yml; also run by installers-dry-run.yml).
  installers:
    name: Windows and macOS installers (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test, sanitizers, cppcheck, secret-scan]
    uses: ./.github/workflows/installers.yml

  release:
    name: publish GitHub release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-packages, installers]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # create the release and upload assets; only this job gets write access
      id-token: write       # sign the build provenance attestation (Sigstore); only this job
      attestations: write   # store the attestation with the repository; only this job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # the write token must not stay in .git/config
      - name: Tag must match the CMake project version
        run: |
          ver="$(sed -n 's/^project(dofscroll VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)"
          tag="${GITHUB_REF_NAME#v}"
          [ -n "$ver" ] || { echo "no project version found in CMakeLists.txt" >&2; exit 1; }
          case "$tag" in
            "$ver"|"$ver"-*) ;;
            *) echo "Tag $GITHUB_REF_NAME does not match project version $ver in CMakeLists.txt" >&2; exit 1 ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # Nothing is published unless every package is there and complete: Linux (RPM, DEB, TGZ), Windows (setup,
      # ZIP) and macOS (DMG), each with the interface and the daemon. A "-daemon-only" file would mean that
      # Qt was missing in a build job; the build jobs fail in that case, this is the second lock.
      - name: Every package is there and none is daemon-only
        run: |
          ver="$(sed -n 's/^project(dofscroll VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)"
          cd dist
          missing=0
          for f in "dofscroll-$ver-1.x86_64.rpm" "dofscroll_${ver}_amd64.deb" "dofscroll-$ver-Linux.tar.gz" \
                   "dofscroll-$ver-windows-x64-setup.exe" "dofscroll-$ver-windows-x64-portable.zip" \
                   "dofscroll-$ver-macos-arm64.dmg"; do
            [ -s "$f" ] || { echo "::error::missing release file: $f"; missing=1; }
          done
          for f in *; do
            case "$f" in
              *daemon-only*) echo "::error::a daemon-only package is in the release files: $f"; missing=1 ;;
            esac
          done
          [ "$missing" -eq 0 ]
      - name: Checksums
        run: |
          cd dist
          # every downloaded file: RPM, DEB, TGZ, Windows setup + ZIP, macOS DMG
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\n' | LC_ALL=C sort \
            | xargs -d '\n' sha256sum -- > ../SHA256SUMS.tmp
          mv ../SHA256SUMS.tmp SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Signed SLSA build provenance for every release file (and SHA256SUMS.txt): which workflow, which
      # commit and which tag produced it. Verify a download with `gh attestation verify <file> -R
      # HoZe-Lukas/dofScroll` (docs/security.md, readme.md). Pinned like the other actions.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "dofscroll ${GITHUB_REF_NAME#v}" $flags
