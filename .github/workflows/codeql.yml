name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly, Monday 04:17 UTC
  workflow_dispatch:

# Default for every job; the analysis job raises exactly what it needs.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pinned to full commit SHAs (tag in the comment).
#   actions/checkout        = v4.2.2
#   github/codeql-action    = v4.39.0

jobs:
  # Reads the pinned container images (packaging/ci/images.env) for the jobs below (`container:`).
  pins:
    name: pinned images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rocky9_image: ${{ steps.read.outputs.ROCKY9_IMAGE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: packaging/ci
          persist-credentials: false
      - id: read
        run: grep -E '^[A-Z0-9_]+=' packaging/ci/images.env >> "$GITHUB_OUTPUT"

  analyze:
    name: CodeQL (c-cpp)
    # Code scanning needs a public repository (or GitHub Advanced Security): skip while private so
    # that it does not fail and send notifications.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    # Same container and dependency set as the ci "build + ctest" job; the daemon (and the core
    # library it links) is compiled and analysed. The Qt interface is not in this image.
    needs: pins
    container: ${{ needs.pins.outputs.rocky9_image }}
    timeout-minutes: 45
    permissions:
      contents: read          # checkout
      security-events: write  # upload SARIF results (only this job)
      actions: read           # codeql-action reads workflow run metadata (private repos)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
      - name: Build (manual, project CMake build)
        run: |
          cmake -S . -B build
          # the shipped programs only; the test executables are not analysed (they only add build time)
          cmake --build build -j4 --target dofscroll
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          category: "/language:c-cpp"
