#
# Windows and macOS builds: the shared core and all unit tests (no tray, no Linux backends), plus
# the platform daemon once cmake/windows.cmake / cmake/macos.cmake exist. ci.yml stays the Linux
# workflow. These jobs are the only place where Windows/macOS code is compiled and tested; they
# cannot verify behavior with real hardware.
#
# The second Windows toolchain (MinGW-w64) runs only after a merge (push to main, tags, on demand),
# not for pull requests: MSVC already checks every PR and the two jobs take about the same time in
# parallel, so MinGW only costs runner minutes there. A MinGW-only break shows up on main (#40).
name: ports

# Work-in-progress branch pushes do not run this workflow (they only produced failure mails):
# it runs for pushes to main and tags, for every pull request, and on demand.
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ports-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (tag in the comment).
#   actions/checkout = v4.2.2
#   actions/upload-artifact = v4.6.2

jobs:
  windows-msvc:
    name: Windows (MSVC) build + ctest
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DDOFSCROLL_WERROR=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Windows packaging scripts (syntax)
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in @(Get-ChildItem packaging/windows -Filter *.ps1) + @(Get-Item scripts/test-driver-coexistence.ps1)) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $bad++; $errs | ForEach-Object { Write-Output "$($f.Name): $($_.Message)" } }
            else { Write-Output "$($f.Name): ok" }
          }
          if ($bad) { exit 1 }
      - name: hidprobe and the driver coexistence script (no device on the runner)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = (Resolve-Path 'build/Release/dofscroll-hidprobe.exe').Path
          & $probe --version
          if ($LASTEXITCODE -ne 0) { throw "hidprobe --version failed: $LASTEXITCODE" }
          & $probe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "hidprobe --help failed: $LASTEXITCODE" }
          & $probe --list --devices-dir devices
          if ($LASTEXITCODE -ne 0) { throw "hidprobe --list failed: $LASTEXITCODE" }
          $report = Join-Path $env:RUNNER_TEMP 'coexistence-report.txt'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-driver-coexistence.ps1 -NonInteractive -ProbePath $probe -ReportPath $report
          if ($LASTEXITCODE -ne 0) { throw "test-driver-coexistence.ps1 failed: $LASTEXITCODE" }
          $text = Get-Content -Raw $report
          Write-Output $text
          foreach ($want in 'Driver running:', 'A: device opened while the driver runs:', 'A: reports received while the driver runs:', 'B: skipped', 'C: skipped') {
            if ($text -notmatch [regex]::Escape($want)) { throw "report lacks: $want" }
          }
          if ($text.Contains($env:USERNAME) -and $env:USERNAME.Length -gt 3) { throw 'report contains the user name' }
      - name: Autostart round trip (HKCU of the runner)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Get-Command pwsh).Source   # any existing file works as the target
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $name = 'dofscroll-ci-msvc'
          # -WhatIf must not change anything
          ./packaging/windows/install-autostart.ps1 -ExePath $exe -Name $name -WhatIf
          if (Get-ItemProperty -Path $key -Name $name -ErrorAction SilentlyContinue) { throw 'WhatIf wrote the value' }
          ./packaging/windows/install-autostart.ps1 -ExePath $exe -Name $name
          ./packaging/windows/install-autostart.ps1 -ExePath $exe -Name $name   # idempotent
          $v = (Get-ItemProperty -Path $key -Name $name).$name
          if ($v -ne ('"' + $exe + '"')) { throw "unexpected Run value: $v" }
          ./packaging/windows/uninstall-autostart.ps1 -Name $name
          if (Get-ItemProperty -Path $key -Name $name -ErrorAction SilentlyContinue) { throw 'value still present after uninstall' }
          ./packaging/windows/uninstall-autostart.ps1 -Name $name   # nothing to remove: still fine
          # Startup-folder variant
          ./packaging/windows/install-autostart.ps1 -ExePath $exe -Name $name -Startup
          $lnk = Join-Path ([Environment]::GetFolderPath('Startup')) ($name + '.lnk')
          if (-not (Test-Path $lnk)) { throw 'shortcut missing' }
          ./packaging/windows/uninstall-autostart.ps1 -Name $name
          if (Test-Path $lnk) { throw 'shortcut still present after uninstall' }
          ./packaging/windows/stop-daemon.ps1 -WhatIf
          ./packaging/windows/stop-ui.ps1 -WhatIf
      - name: Daemon smoke test (once dofscroll.exe is built)
        id: smoke
        shell: pwsh
        run: |
          $exe = $null
          foreach ($c in @("build/Release/dofscroll.exe", "build/dofscroll.exe")) { if (Test-Path -LiteralPath $c -PathType Leaf) { $exe = (Resolve-Path $c).Path; break } }
          if (-not $exe) {
            Write-Output '::notice::dofscroll.exe is not built by this branch yet - smoke test skipped'
            'exe=' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          # dofscroll.exe is a GUI-subsystem program: start it with Start-Process so it is waited for
          $out = Join-Path $env:RUNNER_TEMP 'dofscroll-version.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--version' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
          $text = if (Test-Path $out) { (Get-Content -Raw $out) } else { '' }
          Write-Output "exit code $($p.ExitCode), output: $text"
          if ($p.ExitCode -ne 0) { throw "dofscroll.exe --version failed with exit code $($p.ExitCode)" }
          if ($text -and ($text -notmatch 'dofscroll')) { throw 'unexpected --version output' }
          "exe=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Stage artifact
        if: steps.smoke.outputs.exe != ''
        shell: pwsh
        run: |
          $d = 'dist/dofscroll-windows-msvc'
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Copy-Item '${{ steps.smoke.outputs.exe }}' $d
          Copy-Item -Recurse devices, examples $d
          Copy-Item -Recurse packaging/windows $d/packaging-windows
      - name: Upload artifact
        if: steps.smoke.outputs.exe != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dofscroll-windows-msvc
          path: dist/dofscroll-windows-msvc
          if-no-files-found: error

  windows-mingw:
    name: Windows (MinGW-w64) build + ctest
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MSYSTEM: MINGW64
      CHERE_INVOKING: "1"
    defaults:
      run:
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: pacman -S --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DDOFSCROLL_WERROR=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Windows packaging scripts (syntax)
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in @(Get-ChildItem packaging/windows -Filter *.ps1) + @(Get-Item scripts/test-driver-coexistence.ps1)) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $bad++; $errs | ForEach-Object { Write-Output "$($f.Name): $($_.Message)" } }
            else { Write-Output "$($f.Name): ok" }
          }
          if ($bad) { exit 1 }
      - name: Autostart round trip (HKCU of the runner)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Get-Command pwsh).Source   # any existing file works as the target
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $name = 'dofscroll-ci-mingw'
          # -WhatIf must not change anything
          ./packaging/windows/install-autostart.ps1 -ExePath $exe -Name $name -WhatIf
          if (Get-ItemProperty -Path $key -Name $name -ErrorAction SilentlyContinue) { throw 'WhatIf wrote the value' }
          ./packaging/windows/install-autostart.ps1 -ExePath $exe -Name $name
          ./packaging/windows/install-autostart.ps1 -ExePath $exe -Name $name   # idempotent
          $v = (Get-ItemProperty -Path $key -Name $name).$name
          if ($v -ne ('"' + $exe + '"')) { throw "unexpected Run value: $v" }
          ./packaging/windows/uninstall-autostart.ps1 -Name $name
          if (Get-ItemProperty -Path $key -Name $name -ErrorAction SilentlyContinue) { throw 'value still present after uninstall' }
          ./packaging/windows/uninstall-autostart.ps1 -Name $name   # nothing to remove: still fine
          # Startup-folder variant
          ./packaging/windows/install-autostart.ps1 -ExePath $exe -Name $name -Startup
          $lnk = Join-Path ([Environment]::GetFolderPath('Startup')) ($name + '.lnk')
          if (-not (Test-Path $lnk)) { throw 'shortcut missing' }
          ./packaging/windows/uninstall-autostart.ps1 -Name $name
          if (Test-Path $lnk) { throw 'shortcut still present after uninstall' }
          ./packaging/windows/stop-daemon.ps1 -WhatIf
          ./packaging/windows/stop-ui.ps1 -WhatIf
      - name: Daemon smoke test (once dofscroll.exe is built)
        id: smoke
        shell: pwsh
        run: |
          $exe = $null
          foreach ($c in @("build/dofscroll.exe", "build/Release/dofscroll.exe")) { if (Test-Path -LiteralPath $c -PathType Leaf) { $exe = (Resolve-Path $c).Path; break } }
          if (-not $exe) {
            Write-Output '::notice::dofscroll.exe is not built by this branch yet - smoke test skipped'
            'exe=' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          # dofscroll.exe is a GUI-subsystem program: start it with Start-Process so it is waited for
          $out = Join-Path $env:RUNNER_TEMP 'dofscroll-version.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--version' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
          $text = if (Test-Path $out) { (Get-Content -Raw $out) } else { '' }
          Write-Output "exit code $($p.ExitCode), output: $text"
          if ($p.ExitCode -ne 0) { throw "dofscroll.exe --version failed with exit code $($p.ExitCode)" }
          if ($text -and ($text -notmatch 'dofscroll')) { throw 'unexpected --version output' }
          "exe=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Stage artifact
        if: steps.smoke.outputs.exe != ''
        shell: pwsh
        run: |
          $d = 'dist/dofscroll-windows-mingw'
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Copy-Item '${{ steps.smoke.outputs.exe }}' $d
          Copy-Item -Recurse devices, examples $d
          Copy-Item -Recurse packaging/windows $d/packaging-windows
      - name: Upload artifact
        if: steps.smoke.outputs.exe != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dofscroll-windows-mingw
          path: dist/dofscroll-windows-mingw
          if-no-files-found: error

  macos:
    name: macOS build + ctest
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DDOFSCROLL_WERROR=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Packaging scripts parse (sh -n)
        run: |
          for f in packaging/macos/*.sh; do sh -n "$f"; done
      - name: Driver coexistence script parses (bash -n) and runs without a device
        run: |
          set -eu
          bash -n scripts/test-driver-coexistence.sh
          probe=build/dofscroll-hidprobe
          "$probe" --version
          "$probe" --help >/dev/null
          "$probe" --list --devices-dir devices
          bash scripts/test-driver-coexistence.sh --non-interactive --probe "$probe" --report "$RUNNER_TEMP/coexistence-report.txt" >/dev/null
          cat "$RUNNER_TEMP/coexistence-report.txt"
          grep -q '^A: device opened while the driver runs:' "$RUNNER_TEMP/coexistence-report.txt"
          ! grep -q "$HOME" "$RUNNER_TEMP/coexistence-report.txt"
      - name: shellcheck (if available)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck packaging/macos/*.sh
          else
            echo "shellcheck is not installed on this runner: skipped"
          fi
      - name: LaunchAgent plist renders and lints
        run: |
          sh packaging/macos/install-launchagent.sh --daemon "$PWD/packaging/macos/install-launchagent.sh" \
            --dry-run --no-load > "$RUNNER_TEMP/agent.plist"
          cat "$RUNNER_TEMP/agent.plist"
          plutil -lint "$RUNNER_TEMP/agent.plist"
          if grep -q '@' "$RUNNER_TEMP/agent.plist"; then
            echo "unsubstituted placeholder in the rendered plist" >&2
            exit 1
          fi
      - name: LaunchAgent install/uninstall round trip (only if a GUI launchd domain exists)
        run: |
          if ! launchctl print "gui/$(id -u)" >/dev/null 2>&1; then
            echo "no gui/$(id -u) launchd domain on this runner: round trip skipped"
            exit 0
          fi
          label=io.github.dofscroll.daemon
          plist="$HOME/Library/LaunchAgents/$label.plist"
          # /usr/bin/true stands in for the daemon: only the plist/launchctl handling is tested
          sh packaging/macos/install-launchagent.sh --daemon /usr/bin/true --no-load
          test -f "$plist"
          plutil -lint "$plist"
          # idempotent
          sh packaging/macos/install-launchagent.sh --daemon /usr/bin/true --no-load
          sh packaging/macos/uninstall-launchagent.sh
          test ! -e "$plist"
          sh packaging/macos/uninstall-launchagent.sh
      - name: Daemon smoke test (once the daemon target exists)
        run: |
          if [ -x build/dofscroll ]; then
            build/dofscroll --version
          else
            echo "build/dofscroll does not exist yet (daemon not part of this build): skipped"
          fi
      - name: Stage daemon artifact
        run: |
          if [ -x build/dofscroll ]; then
            mkdir -p stage
            cp build/dofscroll stage/
            cp -R devices examples stage/
          fi
      - name: Upload daemon artifact
        if: hashFiles('stage/dofscroll') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dofscroll-macos
          path: stage
          if-no-files-found: error
