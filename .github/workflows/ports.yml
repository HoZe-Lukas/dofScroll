#
# Windows and macOS builds: the shared core and all unit tests (no tray, no Linux backends), plus
# the platform daemon once cmake/windows.cmake / cmake/macos.cmake exist. ci.yml stays the Linux
# workflow. These jobs are the only place where Windows/macOS code is compiled and tested; they
# cannot verify behavior with real hardware.
name: ports

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ports-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (tag in the comment).
#   actions/checkout = v4.2.2

jobs:
  windows-msvc:
    name: Windows (MSVC) build + ctest
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Configure
        run: cmake -S . -B build -DDOFSCROLL_WERROR=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  windows-mingw:
    name: Windows (MinGW-w64) build + ctest
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MSYSTEM: MINGW64
      CHERE_INVOKING: "1"
    defaults:
      run:
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install toolchain
        run: pacman -S --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DDOFSCROLL_WERROR=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    name: macOS build + ctest
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Configure
        run: cmake -S . -B build -DDOFSCROLL_WERROR=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Packaging scripts parse (sh -n)
        run: |
          for f in packaging/macos/*.sh; do sh -n "$f"; done
      - name: shellcheck (if available)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck packaging/macos/*.sh
          else
            echo "shellcheck is not installed on this runner: skipped"
          fi
      - name: LaunchAgent plist renders and lints
        run: |
          sh packaging/macos/install-launchagent.sh --daemon "$PWD/packaging/macos/install-launchagent.sh" \
            --dry-run --no-load > "$RUNNER_TEMP/agent.plist"
          cat "$RUNNER_TEMP/agent.plist"
          plutil -lint "$RUNNER_TEMP/agent.plist"
          if grep -q '@' "$RUNNER_TEMP/agent.plist"; then
            echo "unsubstituted placeholder in the rendered plist" >&2
            exit 1
          fi
      - name: LaunchAgent install/uninstall round trip (only if a GUI launchd domain exists)
        run: |
          if ! launchctl print "gui/$(id -u)" >/dev/null 2>&1; then
            echo "no gui/$(id -u) launchd domain on this runner: round trip skipped"
            exit 0
          fi
          label=io.github.dofscroll.daemon
          plist="$HOME/Library/LaunchAgents/$label.plist"
          # /usr/bin/true stands in for the daemon: only the plist/launchctl handling is tested
          sh packaging/macos/install-launchagent.sh --daemon /usr/bin/true --no-load
          test -f "$plist"
          plutil -lint "$plist"
          # idempotent
          sh packaging/macos/install-launchagent.sh --daemon /usr/bin/true --no-load
          sh packaging/macos/uninstall-launchagent.sh
          test ! -e "$plist"
          sh packaging/macos/uninstall-launchagent.sh
      - name: Daemon smoke test (once the daemon target exists)
        run: |
          if [ -x build/dofscroll ]; then
            build/dofscroll --version
          else
            echo "build/dofscroll does not exist yet (daemon not part of this build): skipped"
          fi
      - name: Stage daemon artifact
        run: |
          if [ -x build/dofscroll ]; then
            mkdir -p stage
            cp build/dofscroll stage/
            cp -R devices examples stage/
          fi
      - name: Upload daemon artifact
        if: hashFiles('stage/dofscroll') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dofscroll-macos
          path: stage
          if-no-files-found: error
