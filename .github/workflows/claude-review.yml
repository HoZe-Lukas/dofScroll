name: claude-review

# Advisory AI review. NOT a required status check: it must never block a merge.
#
# Two entry points, both with the repository's own secrets (never pull_request_target):
#   review  - every non-draft PR whose head branch lives in THIS repository. Fork PRs get no
#             secrets from GitHub, so they are skipped cleanly.
#   mention - a maintainer comments "@claude" on any PR, including fork PRs. Only comment
#             authors with author_association OWNER, MEMBER or COLLABORATOR can trigger it
#             (the action additionally requires the actor to have write access).
#
# Credentials (repository secrets, either one is enough, OAuth token preferred):
#   CLAUDE_CODE_OAUTH_TOKEN  from a Claude subscription, created with `claude setup-token`
#   ANTHROPIC_API_KEY        Anthropic API key
# If neither exists the jobs end green with a notice. Dependabot-triggered runs read
# Dependabot secrets instead of Actions secrets and are therefore skipped the same way.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Workflow default: no access at all. Each job declares what it needs.
permissions: {}

# Pinned to full commit SHAs (tag in the comment).
#   actions/checkout              = v4.2.2
#   anthropics/claude-code-action = v1.0.253

jobs:
  review:
    name: Claude review
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Newer pushes to the same PR cancel an older, still running review.
    # (Job level on purpose: unrelated events that skip the job never cancel a running one.)
    concurrency:
      group: claude-review-auto-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read        # read the checked-out PR and the diff
      pull-requests: write  # post the review summary and inline comments
      issues: write         # the action's progress/summary comment is an issue comment
      id-token: write       # the action exchanges the job's OIDC token for a short-lived GitHub app token
    steps:
      - name: Check credentials
        id: cred
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH" ] || [ -n "$APIKEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude review skipped::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret available (forks and Dependabot never get one). See docs/repo-settings.md."
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        if: steps.cred.outputs.ok == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6  # v1.0.253
        if: steps.cred.outputs.ok == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is checked out in the working directory.
            Read AGENTS.md and CONTRIBUTING.md first and judge the diff against them.

            Look at the diff for:
            - correctness: logic errors, off-by-one, lifetime/ownership and threading bugs,
              missing error handling, behavior changes without matching tests or docs
            - security: unsafe input handling, privilege or permission changes, command or
              path injection, secrets, new dependencies, workflow permission changes
            - portability: the code must keep working on Linux, Windows and macOS; flag
              platform-specific calls outside the platform layer and non-portable assumptions
            - adherence to AGENTS.md / CONTRIBUTING.md (English only, SPDX headers, style,
              docs updated with behavior changes)

            Rules:
            - Be concise. Do not restate the diff and do not praise.
            - Post an inline comment (mcp__github_inline_comment__create_inline_comment with
              confirmed: true) ONLY for a real issue you are confident about. No nitpicks.
            - Finish with at most one short summary comment via `gh pr comment`
              (say plainly if you found nothing).
            - You are read-only: do not modify files, push, or run builds.
          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  mention:
    name: Claude (@claude comment)
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-review-mention-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read        # read the PR code (the default branch is checked out; the action fetches the PR head itself)
      pull-requests: write  # reply and post inline comments on the PR
      issues: write         # the action's tracking comment is an issue comment
      id-token: write       # OIDC token exchange for the action's GitHub app token
    steps:
      - name: Check credentials
        id: cred
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH" ] || [ -n "$APIKEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude skipped::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret available. See docs/repo-settings.md."
          fi
      # Always the trusted default branch, never code from a fork head: the action itself
      # fetches the PR head, and the tool set below is read-only.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        if: steps.cred.outputs.ok == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6  # v1.0.253
        if: steps.cred.outputs.ok == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --append-system-prompt "You are reviewing a pull request for a C++17 project that must build on Linux, Windows and macOS. Read AGENTS.md and CONTRIBUTING.md and judge the diff for correctness, security, portability and adherence to them. Be concise. Post inline comments only for real issues. You are read-only: never modify files, push, or run builds."
