#
# Builds the Rocky Linux 9 build images of the CI jobs (packaging/ci/rocky9.Dockerfile) and pushes
# them to ghcr.io. The jobs of ci.yml, codeql.yml and linux-packages.yml pull them instead of
# running dnf on every run (#40). Pull requests only build and check the image, they never push.
# The weekly run picks up distribution updates.
name: ci-image

on:
  push:
    branches: [main]
    paths:
      - "packaging/ci/**"
      - "packaging/qt.env"
      - ".github/workflows/ci-image.yml"
  pull_request:
    paths:
      - "packaging/ci/**"
      - "packaging/qt.env"
      - ".github/workflows/ci-image.yml"
  schedule:
    - cron: "41 3 * * 1"   # weekly, Monday 03:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: false

# Third-party actions are pinned to full commit SHAs (tag in the comment).
#   actions/checkout = v4.2.2

jobs:
  image:
    name: Rocky 9 build images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write   # push to ghcr.io (not used for pull requests)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for target in base qt; do
            name="ghcr.io/${owner}/dofscroll-ci-rocky9"
            [ "$target" = qt ] && name="${name}-qt"
            for i in 1 2 3; do
              docker build --target "$target" -t "${name}:latest" -f packaging/ci/rocky9.Dockerfile packaging && break
              echo "::warning::build of $name failed (attempt $i/3)"; sleep 20
              [ "$i" = 3 ] && { echo "::error::build of $name failed after 3 attempts"; exit 1; }
            done
          done
      - name: Check the images
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          docker run --rm "ghcr.io/${owner}/dofscroll-ci-rocky9:latest" sh -c '
            set -e
            for p in g++ make cmake git cppcheck rpmbuild cpio msgfmt desktop-file-validate; do command -v "$p"; done
            pkg-config --exists x11 xtst
            find /usr/include -name "spnav*.h" | grep -q .
            ls /usr/lib64/libasan.so* /usr/lib64/libubsan.so*
            if pkg-config --exists Qt6Widgets; then echo "the base image must not contain Qt"; exit 1; fi'
          . packaging/qt.env
          docker run --rm -e WANT="$QT_VERSION" "ghcr.io/${owner}/dofscroll-ci-rocky9-qt:latest" sh -c '
            set -e
            test -f "$CMAKE_PREFIX_PATH/lib/cmake/Qt6Widgets/Qt6WidgetsConfig.cmake"
            test -f "$CMAKE_PREFIX_PATH/lib/cmake/Qt6Svg/Qt6SvgConfig.cmake"
            command -v lrelease patchelf
            qt="$(qmake -query QT_VERSION)"
            echo "Qt in the image: $qt ($CMAKE_PREFIX_PATH), packaging/qt.env: $WANT"
            test "$qt" = "$WANT"
            # Qt comes from /opt/qt only: the packages bundle it and must not be built against another
            if pkg-config --exists Qt6Widgets; then echo "the qt image must not contain a system Qt"; exit 1; fi' > qt-image.txt || { cat qt-image.txt; exit 1; }
          cat qt-image.txt
          echo "### Qt build image" >> "$GITHUB_STEP_SUMMARY"
          grep '^Qt in the image' qt-image.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Push (not for pull requests)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/${owner}/dofscroll-ci-rocky9:latest"
          docker push "ghcr.io/${owner}/dofscroll-ci-rocky9-qt:latest"
