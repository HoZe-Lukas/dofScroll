#
# Reusable workflow: builds the unsigned Windows (NSIS installer + portable ZIP) and macOS (DMG)
# installers and uploads them as artifacts (installers-windows, installers-macos). It never
# creates a release: ci.yml calls it for tags and its release job attaches the artifacts;
# installers-dry-run.yml calls it on demand. See docs/release-process.md.
name: installers

on:
  workflow_call:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (tag in the comment).
#   actions/checkout          = v4.2.2
#   actions/upload-artifact   = v4.6.2
#   actions/cache             = v6.1.0
#   Qt: version and aqtinstall version from packaging/qt.env (the one file for every build that ships Qt)

jobs:
  package-windows:
    name: Windows installer + ZIP
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # install-qt-action is not used here: it pulls in an unpinned actions/setup-python, which the
      # repository's action policy rejects (the whole job would fail). aqtinstall is pinned instead.
      - name: Install Qt6 (aqtinstall, pinned version)
        # No fallback: if Qt cannot be installed the job fails (an installer without the interface is never published).
        shell: bash
        run: |
          retry() { for i in 1 2 3; do "$@" && return 0; echo "::warning::attempt $i/3 failed: $*"; sleep 10; done; echo "::error::failed after 3 attempts: $*"; return 1; }
          . packaging/qt.env
          retry python -m pip install --require-hashes --no-deps -r packaging/ci/aqt-requirements.txt
          # kept and checked against our own SHA-256 list (packaging/ci/qt-archives.sha256, issue #265)
          retry python -m aqt install-qt windows desktop "${QT_VERSION}" win64_msvc2022_64 -O "$RUNNER_TEMP/Qt" --keep --archive-dest "$RUNNER_TEMP/qt-archives"
          sh packaging/ci/qt-archive-hashes.sh verify "$RUNNER_TEMP/qt-archives"
          rm -rf "$RUNNER_TEMP/qt-archives"
          root="$RUNNER_TEMP/Qt/${QT_VERSION}/msvc2022_64"
          test -f "$root/bin/windeployqt.exe"
          echo "QT_ROOT_DIR=$root" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$root" >> "$GITHUB_ENV"
          echo "$root/bin" >> "$GITHUB_PATH"
      - name: Cache the NSIS download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/nsis-cache
          key: nsis-3.11-c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1
      - name: Install NSIS (pinned zip, SHA-256 checked, no package feed)
        shell: pwsh
        env:
          NSIS_MIRROR_URL: ${{ vars.NSIS_MIRROR_URL }}   # optional fallback, same file (same SHA-256)
        run: ./scripts/install-nsis.ps1 -MirrorUrl "$env:NSIS_MIRROR_URL"
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build "-DDOFSCROLL_UI=ON"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package
        shell: pwsh
        run: ./packaging/windows/build-installer.ps1 -BuildDir build -OutDir dist-installers
      - name: Test the installer (silent install, run, uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Round trip twice: a plain folder and a folder with a space in its name.
          $spaced = 'dofscroll test'
          $setup = (Get-ChildItem dist-installers -Filter '*-setup.exe' | Select-Object -First 1).FullName
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          # every program runs with a time limit, so that a hang fails the step instead of the job
          function Invoke-Limited($file, $argList, $label) {
            Write-Output "run: $label"
            $pr = Start-Process -FilePath $file -ArgumentList $argList -PassThru -WindowStyle Hidden
            if (-not $pr.WaitForExit(120000)) { Stop-Process -Id $pr.Id -Force; throw "$label timed out" }
            if ($pr.ExitCode -ne 0) { throw "$label failed: exit code $($pr.ExitCode)" }
          }
          function Test-RoundTrip($dir, $twice) {
          Write-Output "=== round trip in: $dir"
          # one argument string: /D= must be last and unquoted, even with spaces in the path
          Invoke-Limited $setup "/S /AUTOSTART=1 /D=$dir" 'silent install'
          if ($twice) {
            # a running daemon must be running again after the silent upgrade (the CI runner has no
            # device; if the daemon exits on its own here, the check is skipped with a warning)
            $exe = Join-Path $dir 'dofscroll.exe'
            $d = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
            Start-Sleep -Seconds 3
            $was = -not $d.HasExited
            if (-not $was) { Write-Output "::warning::the daemon does not stay running on this runner: restart check skipped" }
            Invoke-Limited $setup "/S /AUTOSTART=1 /D=$dir" 'silent upgrade (stops a running daemon, starts it again)'
            if ($was) {
              Start-Sleep -Seconds 3
              $now = @(Get-Process -Name 'dofscroll' -ErrorAction SilentlyContinue | Where-Object { $_.Path -and [string]::Equals($_.Path, $exe, [System.StringComparison]::OrdinalIgnoreCase) })
              if ($now.Count -ne 1) { throw "daemon not running exactly once after the silent upgrade: $($now.Count)" }
              if ($now[0].Id -eq $d.Id) { throw 'daemon was not restarted by the upgrade' }
            }
          }
          Get-ChildItem $dir | Select-Object -ExpandProperty Name
          foreach ($f in 'dofscroll.exe', 'dofscroll-hidprobe.exe', 'scripts\test-driver-coexistence.ps1', 'uninstall.exe', 'LICENSE', 'THIRD-PARTY-NOTICES.md', 'devices', 'examples', 'icons', 'scripts\install-autostart.ps1') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing after install: $f" }
          }
          $v = (Get-ItemProperty -Path $runKey -Name 'dofscroll').dofscroll
          if ($v -ne ('"' + (Join-Path $dir 'dofscroll.exe') + '"')) { throw "unexpected Run value: $v" }
          Invoke-Limited (Join-Path $dir 'dofscroll.exe') @('--version') 'dofscroll.exe --version'
          Invoke-Limited (Join-Path $dir 'dofscroll-hidprobe.exe') @('--version') 'dofscroll-hidprobe.exe --version'
          Invoke-Limited (Join-Path $dir 'dofscroll-hidprobe.exe') @('--help') 'dofscroll-hidprobe.exe --help'
          $rep = Join-Path $env:RUNNER_TEMP 'coexistence-report.txt'
          Invoke-Limited 'powershell.exe' @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', ('"' + (Join-Path $dir 'scripts\test-driver-coexistence.ps1') + '"'), '-NonInteractive', '-ReportPath', ('"' + $rep + '"')) 'test-driver-coexistence.ps1 -NonInteractive'
          if (-not (Select-String -LiteralPath $rep -Pattern 'A: device opened while the driver runs:' -Quiet)) { throw 'coexistence report lacks the test A verdict' }
          $ui = Join-Path $dir 'dofscroll-ui.exe'
          if (-not (Test-Path $ui)) { throw 'the installed folder has no dofscroll-ui.exe: every package needs the interface and the daemon' }
          # the Qt runtime comes from the install folder, not from the runner's Qt
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'Qt' }) -join ';'
          $env:QT_QPA_PLATFORM = 'offscreen'
          # windeployqt ships only the "windows" platform plugin; the headless self-test needs the
          # offscreen one (test only: the folder is removed again below). Without it Qt shows a
          # modal error box in this GUI program and waits forever.
          New-Item -ItemType Directory -Force -Path (Join-Path $dir 'platforms') | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:QT_ROOT_DIR 'plugins\platforms\qoffscreen.dll') -Destination (Join-Path $dir 'platforms')
          Invoke-Limited $ui @('--self-test') 'dofscroll-ui.exe --self-test'
          # _?= keeps the uninstaller in place so that the wait really waits for it
          Invoke-Limited (Join-Path $dir 'uninstall.exe') "/S _?=$dir" 'silent uninstall'
          if (Get-ItemProperty -Path $runKey -Name 'dofscroll' -ErrorAction SilentlyContinue) { throw 'autostart value still present after uninstall' }
          if (Test-Path (Join-Path $dir 'dofscroll.exe')) { throw 'dofscroll.exe still present after uninstall' }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\dofscroll') { throw 'uninstall entry still present' }
          Remove-Item -LiteralPath $dir -Recurse -Force
          }
          try {
            Test-RoundTrip (Join-Path $env:RUNNER_TEMP 'dofscroll-inst') $true
            Test-RoundTrip (Join-Path $env:RUNNER_TEMP $spaced) $true
          } catch {
            Write-Output "::error::installer test failed: $($_.Exception.Message)"
            Write-Output $_.ScriptStackTrace
            Get-Content -LiteralPath (Join-Path $env:TEMP 'dofscroll-installer.log') -ErrorAction SilentlyContinue
            exit 1
          }
          # the step must not end with the exit code of a native command run above
          $global:LASTEXITCODE = 0
      - name: Scan packages for runner or staging paths
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/scan" && mkdir -p "$RUNNER_TEMP/scan"
          for z in dist-installers/*.zip; do unzip -q "$z" -d "$RUNNER_TEMP/scan"; done
          # the diagnostic tool and the guided driver test are part of the portable ZIP
          find "$RUNNER_TEMP/scan" -name dofscroll-hidprobe.exe | grep -q .
          find "$RUNNER_TEMP/scan" -name test-driver-coexistence.ps1 | grep -q .
          ws="$GITHUB_WORKSPACE"
          sh scripts/scan-package-paths.sh "$RUNNER_TEMP/scan" \
            "$ws" "${ws//\\//}" "_CPack_Packages" "C:\\Users\\runneradmin" 'C:/Users/runneradmin'
      - name: List the result
        shell: bash
        run: |
          ls -l dist-installers/*.exe dist-installers/*.zip
          for z in dist-installers/*.zip; do unzip -l "$z" | tail -n 15; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: installers-windows
          path: |
            dist-installers/*-setup.exe
            dist-installers/*-portable.zip
          if-no-files-found: error

  package-macos:
    name: macOS DMG
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Qt6 (aqtinstall, pinned version)
        # No fallback: if Qt cannot be installed the job fails (an installer without the interface is never published).
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt-venv"   # the runner's Python is externally managed
          retry() { for i in 1 2 3; do "$@" && return 0; echo "::warning::attempt $i/3 failed: $*"; sleep 10; done; echo "::error::failed after 3 attempts: $*"; return 1; }
          . packaging/qt.env   # Qt 6.8.x links the AGL framework, which the macOS 15 SDK dropped
          retry "$RUNNER_TEMP/aqt-venv/bin/python" -m pip install --require-hashes --no-deps -r packaging/ci/aqt-requirements.txt
          # kept and checked against our own SHA-256 list (packaging/ci/qt-archives.sha256, issue #265)
          retry "$RUNNER_TEMP/aqt-venv/bin/python" -m aqt install-qt mac desktop "${QT_VERSION}" clang_64 -O "$RUNNER_TEMP/Qt" --keep --archive-dest "$RUNNER_TEMP/qt-archives"
          sh packaging/ci/qt-archive-hashes.sh verify "$RUNNER_TEMP/qt-archives"
          rm -rf "$RUNNER_TEMP/qt-archives"
          root="$RUNNER_TEMP/Qt/${QT_VERSION}/macos"
          test -x "$root/bin/macdeployqt"
          echo "QT_ROOT_DIR=$root" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$root" >> "$GITHUB_ENV"
          echo "$root/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDOFSCROLL_UI=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Package
        run: |
          if [ -n "${QT_ROOT_DIR:-}" ]; then export PATH="$QT_ROOT_DIR/bin:$PATH"; fi
          sh packaging/macos/build-dmg.sh --build build --out dist-installers
      - name: Test the image (mount, verify signature, run)
        run: |
          set -eu
          # the bundle ships only the cocoa platform plugin; the headless self-test uses the offscreen
          # plugin of the runner's Qt (the frameworks still come from the bundle)
          qt_platforms="${QT_ROOT_DIR:-/nonexistent}/plugins/platforms"
          mnt="$RUNNER_TEMP/dmg-mnt"
          mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" dist-installers/*.dmg
          trap 'hdiutil detach "$mnt" -force >/dev/null || true' EXIT
          ls -l "$mnt"
          # every image holds the interface and the daemon (no daemon-only fallback)
          test -d "$mnt/dofscroll.app" || { echo "::error::the image has no dofscroll.app"; exit 1; }
          test -x "$mnt/dofscroll.app/Contents/MacOS/dofscroll-ui"
          codesign --verify --deep --strict "$mnt/dofscroll.app"
          plutil -p "$mnt/dofscroll.app/Contents/Info.plist"
          d="$mnt/dofscroll.app/Contents/Resources/daemon/dofscroll"
          test -x "$d"
          "$d" --version
          # the diagnostic tool and the guided driver test are part of the image
          probe="$(dirname "$d")/dofscroll-hidprobe"
          test -x "$probe"
          "$probe" --version
          "$probe" --help >/dev/null
          script="$mnt/dofscroll.app/Contents/Resources/diagnostics/test-driver-coexistence.sh"
          test -x "$script"
          bash "$script" --non-interactive --report "$RUNNER_TEMP/coexistence-report.txt" >/dev/null
          grep -q '^A: device opened while the driver runs:' "$RUNNER_TEMP/coexistence-report.txt"
          # the frameworks must come from the bundle, not from the runner's Qt
          env -u QT_ROOT_DIR -u DYLD_FRAMEWORK_PATH QT_QPA_PLATFORM=offscreen QT_QPA_PLATFORM_PLUGIN_PATH="$qt_platforms" \
            "$mnt/dofscroll.app/Contents/MacOS/dofscroll-ui" --self-test
          # Round trip in a folder with spaces and non-ASCII characters (umlauts, CJK, an emoji and an
          # ampersand; UTF-8 bytes written as octal escapes so that this file stays ASCII). HOME points
          # into the sandbox folder, so no real LaunchAgent is touched; nothing is loaded into launchd.
          odd="$(printf 'dofscroll \303\244\303\266\303\274 & \346\227\245\346\234\254\350\252\236 \360\237\230\200')"
          sandbox="$RUNNER_TEMP/$odd"
          rm -rf "$sandbox" && mkdir -p "$sandbox/home" "$sandbox/pkg"
          cp -R "$mnt/." "$sandbox/pkg/"
          test -d "$sandbox/pkg/dofscroll.app"
          res="$sandbox/pkg/dofscroll.app/Contents/Resources"
          d="$res/daemon/dofscroll"
          codesign --verify --deep --strict "$sandbox/pkg/dofscroll.app"
          env -u QT_ROOT_DIR -u DYLD_FRAMEWORK_PATH QT_QPA_PLATFORM=offscreen QT_QPA_PLATFORM_PLUGIN_PATH="$qt_platforms" \
            "$sandbox/pkg/dofscroll.app/Contents/MacOS/dofscroll-ui" --self-test
          "$d" --version
          HOME="$sandbox/home" sh "$res/launchagent/install-launchagent.sh" --daemon "$d" --no-load
          plist="$sandbox/home/Library/LaunchAgents/io.github.dofscroll.daemon.plist"
          plutil -lint "$plist"
          test "$(plutil -extract ProgramArguments.0 raw -o - "$plist")" = "$d"
          grep -q '&amp;' "$plist"
          HOME="$sandbox/home" sh "$res/launchagent/uninstall-launchagent.sh"
          test ! -e "$plist"
          rm -rf "$sandbox"
          rm -rf "$RUNNER_TEMP/scan" && mkdir -p "$RUNNER_TEMP/scan"
          cp -R "$mnt/." "$RUNNER_TEMP/scan/"
          sh scripts/scan-package-paths.sh "$RUNNER_TEMP/scan" \
            "$GITHUB_WORKSPACE" "_CPack_Packages" "/Users/runner" "/Volumes/dofscroll"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: installers-macos
          path: dist-installers/*.dmg
          if-no-files-found: error
