name: pages

# Publishes the static website in site/ to GitHub Pages (Settings > Pages > Source: GitHub Actions).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/check-site.*"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege: the build job only reads the repository; only the deploy job gets the Pages rights.
permissions:
  contents: read

# One deployment at a time; a running deployment is not cancelled half way.
concurrency:
  group: pages
  cancel-in-progress: false

# Third-party actions are pinned to full commit SHAs (tag in the comment).
#   actions/checkout              = v7.0.1
#   actions/configure-pages       = v6.0.0
#   actions/upload-pages-artifact = v5.0.0
#   actions/deploy-pages          = v5.0.1

jobs:
  build:
    name: validate and package the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the site (links, metadata, English/German parity, contrast, size)
        run: sh scripts/check-site.sh

      - name: Package the site folder
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write      # publish to Pages
      id-token: write   # prove to Pages that the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
