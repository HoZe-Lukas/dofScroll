# dofscroll configuration - written by the tray program.
# Note: comments in this file are NOT preserved when saving.
# Sections: [global], [device:NAME], [app:NAME] - overridden keys only.
# Linux (spacenavd/libspnav axis order). The profile of the attached device is added at the first start.

[global]
ENABLED = 1
LIVE_FEED = 1
MODE = normal
SCROLL_V_MIX = z + rx
SCROLL_V_SENS = 5
SCROLL_V_DEADZONE = 30
SCROLL_V_SIGN = 1
SCROLL_V_CURVE = 1.5
SCROLL_V_SMOOTH_MS = 1
SCROLL_H_MIX = x - rz
SCROLL_H_SENS = 3
SCROLL_H_DEADZONE = 30
SCROLL_H_SIGN = -1
SCROLL_H_CURVE = 1.5
SCROLL_H_SMOOTH_MS = 1
ZOOM_MIX = ry
ZOOM_SENS = 2
ZOOM_DEADZONE = 20
ZOOM_SIGN = -1
ZOOM_CURVE = 1
ZOOM_SMOOTH_MS = 1
ZOOM_LATERAL = x z rx rz
ZOOM_ENTER_MS = 40
ZOOM_EXIT_RATIO = 1.5
BACKEND = auto
TICK_HZ = 250
