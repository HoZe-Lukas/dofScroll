# Example of the split layout: copy the content of this folder into ~/.config/dofscroll/ (Windows:
# %APPDATA%\dofscroll\, macOS: ~/Library/Application Support/dofscroll/).
# dofscroll.conf holds [global] only. Every device profile is one file in devices/, every program
# profile one file in apps/. The header inside a file names the device or program; the file name
# is only a label. See docs/configuration.md.

[global]
# Vertical scrolling: sum of weighted axes
SCROLL_V_MIX = z + rx
SCROLL_V_SENS = 5
SCROLL_V_DEADZONE = 30
SCROLL_V_SIGN = 1
SCROLL_V_CURVE = 0:0 50:0.1 200:1 350:3
SCROLL_V_SMOOTH_MS = 20

# Horizontal scrolling
SCROLL_H_MIX = x - rz
SCROLL_H_SENS = 3
SCROLL_H_DEADZONE = 20
SCROLL_H_SIGN = 1
SCROLL_H_CURVE = 1.5
SCROLL_H_SMOOTH_MS = 20

# Zoom (twist around the Y axis)
ZOOM_MIX = ry
ZOOM_SENS = 5
ZOOM_DEADZONE = 40
ZOOM_SIGN = 1
ZOOM_CURVE = 1.0
ZOOM_SMOOTH_MS = 0
ZOOM_LATERAL = x z rx rz
ZOOM_ENTER_MS = 40
ZOOM_EXIT_RATIO = 1.5

BACKEND = auto
TICK_HZ = 250
