#
# Switching tabs: pushing sideways presses Ctrl+Page Up / Ctrl+Page Down (previous / next tab in
# browsers and terminals; not verified in every program). The rate follows the deflection. The
# other channels keep their default behavior.
#
# SAFETY: a mode file can press any key (including modifier chords) while a button is held or an
# axis is deflected. Only use mode files from sources you trust and read them first: look for
# key:, keys:, zoom and mode:. The daemon warns at load time about modifier-capable bindings.
# See docs/modes.md, section "Safety and sharing modes".
NAME = Tabs
DESCRIPTION = For browsers and terminals. Forward/back still scrolls and twist still zooms; push or tilt sideways switches to the previous or next tab (Ctrl+Page Up / Ctrl+Page Down).

V_ACTION = default
H_ACTION = keys:ctrl+pageup,ctrl+pagedown
TWIST_ACTION = default
