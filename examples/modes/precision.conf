#
# Fine control: the normal scroll and zoom behavior with clearly lower sensitivities.
# Select it from the tray "Mode" menu, or per program / device with MODE = precision in a
# profile.
#
# SAFETY: a mode file can press any key (including modifier chords) while a button is held or an
# axis is deflected. Only use mode files from sources you trust and read them first: look for
# key:, keys:, zoom and mode:. The daemon warns at load time about modifier-capable bindings.
# See docs/modes.md, section "Safety and sharing modes".
NAME = Precision
DESCRIPTION = Like normal, but much slower: low sensitivity for fine, careful scrolling and zooming, for example in spreadsheets or while editing text.

V_ACTION = default
H_ACTION = default
TWIST_ACTION = default

# Defaults are 5 (vertical), 3 (horizontal) and 5 (zoom):
SCROLL_V_SENS = 2
SCROLL_H_SENS = 1
ZOOM_SENS = 2
