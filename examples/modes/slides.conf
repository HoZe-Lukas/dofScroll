#
# Presentations: pushing up/down pages through the slides (Page Up / Page Down). The rate
# follows the deflection, so a gentle push pages slowly. Sideways and twist do nothing.
# Assign it to the presentation program: [app:impress] with MODE = slides in dofscroll.conf.
# Key meaning in your program is not verified.
#
# SAFETY: a mode file can press any key (including modifier chords) while a button is held or an
# axis is deflected. Only use mode files from sources you trust and read them first: look for
# key:, keys:, zoom and mode:. The daemon warns at load time about modifier-capable bindings.
# See docs/modes.md, section "Safety and sharing modes".
NAME = Slides (page keys)
DESCRIPTION = Up/down = page up/down, other channels off

V_ACTION = keys:pageup,pagedown
H_ACTION = none
TWIST_ACTION = none

# Gentler than the scroll default, so a push does not race through the deck:
SCROLL_V_SENS = 2
