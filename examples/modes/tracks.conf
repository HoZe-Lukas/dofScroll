#
# Change track: pushing sideways presses Previous track / Next track, one press per push. The other
# channels keep their default behavior. The media keys are not sent on macOS. The interface's
# "Change track" tile for a motion is made from the action below.
#
# SAFETY: a mode file can press any key (including modifier chords) while a button is held or an
# axis is deflected. Only use mode files from sources you trust and read them first: look for
# key:, keys:, zoom and mode:. The daemon warns at load time about modifier-capable bindings.
# See docs/modes.md, section "Safety and sharing modes".
NAME = Tracks
DESCRIPTION = For music and video players. Push or tilt sideways to go to the previous or next track, one track per push (Previous / Next track). Forward/back still scrolls and twist still zooms. Not sent on macOS.

V_ACTION = default
H_ACTION = step:media_prev,media_next
TWIST_ACTION = default
