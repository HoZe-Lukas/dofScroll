#
# Maps and anything that understands arrow keys and plus/minus: up/down and sideways pan with
# the arrow keys, twisting zooms with minus/plus. The rate follows the deflection.
# `plus` and `minus` are the main-keyboard keys and depend on the keyboard layout, see
# docs/modes.md (Key names). Behavior in real programs is not verified.
#
# SAFETY: a mode file can press any key (including modifier chords) while a button is held or an
# axis is deflected. Only use mode files from sources you trust and read them first: look for
# key:, keys:, zoom and mode:. The daemon warns at load time about modifier-capable bindings.
# See docs/modes.md, section "Safety and sharing modes".
NAME = Map
DESCRIPTION = For maps. Push or tilt in any direction to move the map with the arrow keys; twist to zoom with the Minus and Plus keys.

V_ACTION = keys:up,down
H_ACTION = keys:left,right
TWIST_ACTION = keys:minus,plus
