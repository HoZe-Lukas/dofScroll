#
# Volume: pushing or tilting forward/back presses Volume up / Volume down; the rate follows the
# deflection. Sideways and twist keep their default behavior. The volume keys are not sent on macOS.
# The interface's "Volume" tile for a motion is made from the action below.
#
# SAFETY: a mode file can press any key (including modifier chords) while a button is held or an
# axis is deflected. Only use mode files from sources you trust and read them first: look for
# key:, keys:, zoom and mode:. The daemon warns at load time about modifier-capable bindings.
# See docs/modes.md, section "Safety and sharing modes".
NAME = Volume
DESCRIPTION = For anything that plays sound. Push or tilt forward/back to raise or lower the volume (Volume up / Volume down). Sideways still scrolls and twist still zooms. Not sent on macOS.

V_ACTION = keys:volume_up,volume_down
H_ACTION = default
TWIST_ACTION = default
