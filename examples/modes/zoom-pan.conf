#
# Timelines of audio and video editors: push up/down zooms, twisting scrolls sideways (horizontal wheel).
#
# SAFETY: a mode file can press any key (including modifier chords) while a button is held or an
# axis is deflected. Only use mode files from sources you trust and read them first: look for
# key:, keys:, zoom and mode:. The daemon warns at load time about modifier-capable bindings.
# See docs/modes.md, section "Safety and sharing modes".
NAME = Zoom and pan
DESCRIPTION = For audio and video timelines. Forward/back zooms in and out, twist scrolls sideways along the timeline (horizontal wheel); sideways keeps its normal behavior.

V_ACTION = zoom
H_ACTION = default
TWIST_ACTION = wheel_h
