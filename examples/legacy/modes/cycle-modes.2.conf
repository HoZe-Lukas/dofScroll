#
# Normal scrolling and zooming, plus a button that switches modes.
# Pressing button 2 cycles through all loaded modes in alphabetical order of their id
# (built-ins included, wrapping around). The switch lasts until the daemon restarts, the
# config or modes are reloaded, or another switch happens. A fixed target also works:
# BUTTON_3 = mode:timeline
# To keep cycling from the other modes, add the same BUTTON_2 line to them.
#
# SAFETY: a mode file can press any key (including modifier chords) while a button is held or an
# axis is deflected. Only use mode files from sources you trust and read them first: look for
# key:, keys:, zoom and mode:. The daemon warns at load time about modifier-capable bindings.
# See docs/modes.md, section "Safety and sharing modes".
NAME = Mode cycling
DESCRIPTION = Default channels; button 2 switches to the next mode

BUTTON_2 = mode:next
