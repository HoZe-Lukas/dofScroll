#
# Video editing (e.g. the DaVinci Resolve edit page).
# Sideways push/tilt scrubs the playhead, twisting steps single frames; both channels press
# the left/right arrow keys (rate follows the deflection). Pushing up/down does nothing.
# Assign it to the editor: [app:resolve] with MODE = timeline in dofscroll.conf.
#
# SAFETY: a mode file can press any key (including modifier chords) while a button is held or an
# axis is deflected. Only use mode files from sources you trust and read them first: look for
# key:, keys:, zoom and mode:. The daemon warns at load time about modifier-capable bindings.
# See docs/modes.md, section "Safety and sharing modes".
NAME = Timeline (scrub / single frames)
DESCRIPTION = Sideways = scrub, twist = single frames (left/right arrow keys)

V_ACTION = none
H_ACTION = keys:left,right
TWIST_ACTION = keys:left,right

# Buttons (indices as reported by the device; a model has fewer than 32):
BUTTON_1 = key:space     # play / pause
BUTTON_2 = key:home      # jump to the start

# Gentler scrubbing than the scroll default (any settings key is allowed here):
SCROLL_H_SENS = 4
