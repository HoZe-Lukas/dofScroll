#
# Paging through documents or slides: push up/down pages through the document, sideways
# moves between pages with the arrow keys, twisting zooms with Ctrl + mouse wheel.
NAME = Browse (page keys)
DESCRIPTION = Up/down = page up/down, sideways = left/right, twist = zoom

V_ACTION = keys:pageup,pagedown
H_ACTION = keys:left,right
TWIST_ACTION = zoom

# First button: Enter; second button: Escape
BUTTON_0 = key:enter
BUTTON_1 = key:esc
