# Example configuration for dofscroll - SpaceMouse Pro.
# Copy to ~/.config/dofscroll/dofscroll.conf (first: mkdir -p ~/.config/dofscroll). For the SpaceMouse Compact: dofscroll-compact.conf.
# '#' and ';' start comments. Sections contain overrides only.

[global]
# Vertical scrolling: sum of weighted axes
SCROLL_V_MIX = z + rx
SCROLL_V_SENS = 5            # 0..255, 0 = Kanal aus
SCROLL_V_DEADZONE = 30       # raw sensor units
SCROLL_V_SIGN = 1            # 1 or -1
# Curve as a point list "input:factor" (overrides an exponent)
SCROLL_V_CURVE = 0:0 50:0.1 200:1 350:3
SCROLL_V_SMOOTH_MS = 20      # smoothing, 0 = off

# Horizontal scrolling
SCROLL_H_MIX = x - rz
SCROLL_H_SENS = 3
SCROLL_H_DEADZONE = 20
SCROLL_H_SIGN = 1
SCROLL_H_CURVE = 1.5         # simple exponent
SCROLL_H_SMOOTH_MS = 20

# Zoom (twist around the Y axis)
ZOOM_MIX = ry
ZOOM_SENS = 5
ZOOM_DEADZONE = 40
ZOOM_SIGN = 1
ZOOM_CURVE = 1.0
ZOOM_SMOOTH_MS = 0
ZOOM_LATERAL = x z rx rz     # axes the zoom twist must dominate
ZOOM_ENTER_MS = 40
ZOOM_EXIT_RATIO = 1.5

BACKEND = auto               # auto | x11 | uinput
TICK_HZ = 250                # 30..1000

[device:SpaceMouse Pro]
# applies when the device name contains this text
SCROLL_V_SENS = 8

[app:firefox]
# applies when WM_CLASS contains this text
ZOOM_SENS = 12

# DaVinci Resolve: timeline mode (push/tilt sideways = scrub, twist = single frames,
# each as left/right arrow; frames/s depending on deflection). The program name (WM_CLASS) is shown in the
# tray menu under "Program:" - adjust the pattern if necessary. Speed via *_SENS/*_CURVE:
# [app:resolve]
# MODE = timeline
# SCROLL_H_SENS = 4     # scrubbing (max. approx. 70 frames/s at full deflection)
# ZOOM_SENS = 1         # single frames (max. approx. 17 frames/s), ZOOM_SIGN = -1 reverses the direction

# Disable control completely for one program (e.g. Blender with its own 3D navigation):
# [app:blender]
# ENABLED = 0

# A code editor: the normal mapping, but the twist does not zoom, the tilt of the vertical direction does nothing
# (the push still scrolls) and button 1 sends another key than in the device profile. The keys V_ACTION, H_ACTION,
# TWIST_ACTION, V_PUSH_ACTION, V_TILT_ACTION, H_PUSH_ACTION and H_TILT_ACTION are the ones of the joystick mode files
# and work in [global], [device:*] and [app:*]; the program profile beats the joystick mode.
[app:code]
TWIST_ACTION = none
V_TILT_ACTION = none
BUTTON_1 = key:ctrl+s
BUTTON_2 = none        # nothing here, although Global or the device binds button 2
