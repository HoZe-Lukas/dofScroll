# Beispielkonfiguration fuer dofscroll - SpaceMouse PRO (ohne Tasten bzw. Pro-Umbau).
# Nach ~/.config/dofscroll/dofscroll.conf kopieren (vorher: mkdir -p ~/.config/dofscroll). Fuer die SpaceMouse Compact: dofscroll-compact.conf.
# '#' und ';' leiten Kommentare ein. Sektionen enthalten nur Ueberschreibungen.

[global]
# Vertikales Scrollen: Summe aus gewichteten Achsen
SCROLL_V_MIX = z + rx
SCROLL_V_SENS = 5            # 0..255, 0 = Kanal aus
SCROLL_V_DEADZONE = 30       # Rohsensor-Einheiten
SCROLL_V_SIGN = 1            # 1 oder -1
# Kurve als Punktliste "Eingabe:Faktor" (ueberschreibt einen Exponenten)
SCROLL_V_CURVE = 0:0 50:0.1 200:1 350:3
SCROLL_V_SMOOTH_MS = 20      # Glaettung, 0 = aus

# Horizontales Scrollen
SCROLL_H_MIX = x - rz
SCROLL_H_SENS = 3
SCROLL_H_DEADZONE = 20
SCROLL_H_SIGN = 1
SCROLL_H_CURVE = 1.5         # einfacher Exponent
SCROLL_H_SMOOTH_MS = 20

# Zoom (Drehung um die Y-Achse)
ZOOM_MIX = ry
ZOOM_SENS = 5
ZOOM_DEADZONE = 40
ZOOM_SIGN = 1
ZOOM_CURVE = 1.0
ZOOM_SMOOTH_MS = 0
ZOOM_LATERAL = x z rx rz     # Achsen, gegen die der Zoom-Twist dominieren muss
ZOOM_ENTER_MS = 40
ZOOM_EXIT_RATIO = 1.5

BACKEND = auto               # auto | x11 | uinput
TICK_HZ = 250                # 30..1000
NAV_BUTTON = 0
NAV_BUTTON_ENABLED = 0
CLICK_BUTTON = 1
CLICK_BUTTON_ENABLED = 0

[device:SpaceMouse Pro]
# greift, wenn der Geraetename diesen Text enthaelt
SCROLL_V_SENS = 8

[app:firefox]
# greift, wenn WM_CLASS diesen Text enthaelt
ZOOM_SENS = 12

# DaVinci Resolve: Timeline-Modus (seitlich schieben/kippen = Scrubben, Drehen = Einzelbilder,
# jeweils Pfeil links/rechts; Frames/s je nach Auslenkung). Der Programmname (WM_CLASS) steht im
# Tray-Menue unter "Programm:" - das Muster ggf. anpassen. Geschwindigkeit ueber *_SENS/*_CURVE:
# [app:resolve]
# MODE = timeline
# SCROLL_H_SENS = 4     # Scrubben (max. ca. 70 Frames/s bei voller Auslenkung)
# ZOOM_SENS = 1         # Einzelbilder (max. ca. 17 Frames/s), ZOOM_SIGN = -1 dreht die Richtung

# Steuerung fuer ein Programm komplett abschalten (z.B. Blender mit eigener 3D-Navigation):
# [app:blender]
# ENABLED = 0
