# Button mode: next joystick mode. Each press switches to the next mode in alphabetical order.
# Use it with BUTTON_<n> = buttonmode:next-mode or pick it from the button drop-down in the
# interface. See docs/button-modes.md.
NAME = Next mode
DESCRIPTION = Switches to the next joystick mode
ACTION = mode:next
