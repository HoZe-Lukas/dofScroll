#
# Button mode: next joystick mode. Each press switches to the next mode in alphabetical order.
# Use it with BUTTON_<n> = buttonmode:next-mode or pick it from the button drop-down in the
# interface. See docs/button-modes.md.
NAME = Next mode
DESCRIPTION = Each press switches to the next joystick mode in alphabetical order of their ids (built-in and your own) and starts over after the last. To choose which modes it visits, use 'Next favorite mode'.
ACTION = mode:next
# To cycle through your own list of modes, in your order, instead of all modes, add (ids of
# joystick modes; see docs/button-modes.md):
# CYCLE = slides, media, map
