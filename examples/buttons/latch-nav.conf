#
# Button mode: latch navigation. One press switches navigation on (axes press the arrow keys
# instead of scrolling), the next press switches it off. Use it with BUTTON_<n> = buttonmode:latch-nav
# or pick it from the button drop-down in the interface. See docs/button-modes.md.
NAME = Navigation latch
DESCRIPTION = Navigation makes the cap work like arrow keys: push or tilt presses Up, Down, Left or Right instead of scrolling (to move a cursor or a selection). Press once to switch it on, press again to switch it off.
ACTION = toggle:nav
