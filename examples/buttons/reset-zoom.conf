#
# Button mode: reset zoom. Each press taps Ctrl+0 once, which resets the zoom in most programs
# (browsers, editors, image viewers). Use it with BUTTON_<n> = buttonmode:reset-zoom or pick it from
# the button drop-down in the interface. See docs/button-modes.md.
NAME = Reset zoom
DESCRIPTION = Sends Ctrl+0: resets the zoom in most programs (browsers, editors, image viewers)
ACTION = key:ctrl+0
