#
# Button mode: next favorite mode. Each press switches to the next mode of the CYCLE list, in this
# order, wrapping around; if the current mode is not in the list the first entry is used. Edit
# the list to your modes (ids of joystick modes; unknown ids are skipped). For the opposite direction
# copy the file with ACTION = mode:prev and the same list. See docs/button-modes.md.
NAME = Next favorite mode
DESCRIPTION = Cycles through a chosen list of joystick modes
ACTION = mode:next
CYCLE = timeline, normal
