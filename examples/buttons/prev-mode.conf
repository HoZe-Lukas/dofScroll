# Button mode: previous joystick mode. Each press switches to the previous mode in alphabetical
# order (wrapping around), the mirror of next-mode. See docs/button-modes.md.
NAME = Previous mode
DESCRIPTION = Each press switches to the previous joystick mode in alphabetical order of their ids (built-in and your own) and wraps around at the first. To choose which modes it visits, copy it and set a cycle list.
ACTION = mode:prev
