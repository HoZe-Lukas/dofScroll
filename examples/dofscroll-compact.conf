# Example configuration for dofscroll - SpaceMouse COMPACT (2 buttons).
# Copy to ~/.config/dofscroll/dofscroll.conf (first: mkdir -p ~/.config/dofscroll). For the SpaceMouse Pro: dofscroll-pro.conf.
# '#' and ';' start comments. Sections contain overrides only.

[global]
# Vertical scrolling: sum of weighted axes
SCROLL_V_MIX = z + rx
SCROLL_V_SENS = 5            # 0..255, 0 = Kanal aus
SCROLL_V_DEADZONE = 30       # raw sensor units
SCROLL_V_SIGN = 1            # 1 or -1
# Curve as a point list "input:factor" (overrides an exponent)
SCROLL_V_CURVE = 0:0 50:0.1 200:1 350:3
SCROLL_V_SMOOTH_MS = 20      # smoothing, 0 = off

# Horizontal scrolling
SCROLL_H_MIX = x - rz
SCROLL_H_SENS = 3
SCROLL_H_DEADZONE = 20
SCROLL_H_SIGN = 1
SCROLL_H_CURVE = 1.5         # simple exponent
SCROLL_H_SMOOTH_MS = 20

# Zoom (twist around the Y axis)
ZOOM_MIX = ry
ZOOM_SENS = 5
ZOOM_DEADZONE = 40
ZOOM_SIGN = 1
ZOOM_CURVE = 1.0
ZOOM_SMOOTH_MS = 0
ZOOM_LATERAL = x z rx rz     # axes the zoom twist must dominate
ZOOM_ENTER_MS = 40
ZOOM_EXIT_RATIO = 1.5

BACKEND = auto               # auto | x11 | uinput
TICK_HZ = 250                # 30..1000
NAV_BUTTON = 0
NAV_BUTTON_ENABLED = 1   # hold left button: arrow keys instead of scroll
CLICK_BUTTON = 1
CLICK_BUTTON_ENABLED = 1 # right button: left mouse button

[device:SpaceMouse Compact]
# applies when the device name contains this text
NAV_BUTTON_ENABLED = 1
CLICK_BUTTON_ENABLED = 1

[app:firefox]
# applies when WM_CLASS contains this text
ZOOM_SENS = 12
